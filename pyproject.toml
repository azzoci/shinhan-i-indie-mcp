[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homestock"
version = "0.1.0"
description = "Shinhan Indi MCP trading gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0",
  "starlette>=0.37.2,<0.38",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
real = [
  "PyQt5>=5.15",
]
dev = [
  "pytest>=8",
]

[project.scripts]
homestock-mcp = "homestock.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["homestock*"]
